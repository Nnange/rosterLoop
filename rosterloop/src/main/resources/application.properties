#SPRING_PROFILE=local
spring.application.name=rosterloop
spring.config.import=optional:secrets.properties

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/households
spring.datasource.username=postgres
#spring.datasource.password=****
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
#server.port=9091

# JWT Configuration
app.jwtSecret=mySecretKeyThatIsAtLeast256BitsLongForHS256SigningAlgorithmUseCaseRosterLoop12345678
app.jwtExpirationMs=86400000

# Admin Configuration
# IMPORTANT: Change this to a secure random token in production
# Generate a secure token: openssl rand -base64 32
app.admin.creation-token=your-secure-admin-creation-token-change-this-in-production

# Logging
logging.level.root=INFO
logging.level.com.rosterloop=DEBUG


